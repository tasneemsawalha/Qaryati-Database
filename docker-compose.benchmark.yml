# Always use a separate project name, e.g. qaryati-perf-before or qaryati-perf-after.
# No host database port or application-data volume is shared with qaryati-updated.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: disposable-benchmark-only
      POSTGRES_DB: qaryati_benchmark
    volumes:
      - benchmark_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d qaryati_benchmark"]
      interval: 3s
      timeout: 5s
      retries: 30
  migrate:
    build:
      context: .
      dockerfile: performance/Dockerfile
      args:
        BENCHMARK_STAGE: ${BENCHMARK_STAGE:-before}
    environment:
      DATABASE_URL: postgresql://benchmark:disposable-benchmark-only@postgres:5432/qaryati_benchmark
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: performance/Dockerfile
      args:
        BENCHMARK_STAGE: ${BENCHMARK_STAGE:-before}
    environment:
      DATABASE_URL: postgresql://benchmark:disposable-benchmark-only@postgres:5432/qaryati_benchmark
      PORT: 3000
      API_RATE_LIMIT: 100000
      AUTH_RATE_LIMIT: 100
      SESSION_TTL_SECONDS: 86400
    ports:
      - "127.0.0.1:${BENCHMARK_PORT:-3100}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  k6:
    image: grafana/k6@sha256:3e4186aea62e11a45560bfc51e19eeafe82fc07ce069c78aff44b7ff893d9a5e
    profiles: ["tools"]
    environment:
      BASE_URL: http://api:3000/api/v1
      BENCHMARK_ONLY: "true"
      SEARCH: Synthetic 9999
      VUS: 10
      DURATION: 10s
    volumes:
      - ./performance:/scripts:ro
      - ./performance/results:/results
    depends_on:
      api:
        condition: service_healthy
volumes:
  benchmark_data:
