services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qaryati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-qaryati}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - qaryati_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qaryati}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qaryati}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qaryati}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qaryati}
      PORT: 3000
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-120}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      GEOCODING_TIMEOUT_MS: ${GEOCODING_TIMEOUT_MS:-2500}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  qaryati_data:
