server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API calls: the browser never needs CORS for /api.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Client-side routes (/villages/1, /stats ...) fall back to the SPA.
  location / {
    try_files $uri /index.html;
  }
}
